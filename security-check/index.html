<style>
  :root {
    --ink: #1a1a1f;
    --sub: #5f6370;
    --line: #e3e5ea;
    --card: #ffffff;
    --soft: #f5f6f8;
    --accent: #2b50ff;
    --accent-soft: #eaeeff;
    --ok: #12805c;

    --warn: #a15c00;
    --warn-soft: #fff3de;
    --bad: #c62828;
    --bad-soft: #fdeaea;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, &quot;Noto Sans KR&quot;, &quot;Malgun Gothic&quot;, sans-serif;

    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--accent); margin: 0 0 8px; }
  h1 { font-size: 24px; line-height: 1.35; margin: 0 0 10px; letter-spacing: -0.02em; }
  .lead { color: var(--sub); font-size: 15px; margin: 0 0 22px; }
  .progress { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .bar { flex: 1; height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
  .step { font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
  .tag { display: inline-block; font-size: 12.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 99px; margin-bottom: 10px; }
  .q { font-size: 19px; font-weight: 700; line-height: 1.45; margin: 0 0 6px; letter-spacing: -0.01em; }
  .hint { font-size: 14px; color: var(--sub); margin: 0 0 16px; }
  .opts { display: grid; gap: 10px; }
  .opt {
    appearance: none; text-align: left; width: 100%;
    font: inherit; font-size: 15px; color: var(--ink);
    background: var(--card); border: 1.5px solid var(--line);
    border-radius: 14px; padding: 14px 16px; cursor: pointer;
    transition: border-color .15s, background .15s;

  .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
  .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

      desc = &quot;지금 위험하다는 뜻은 아니지만, 사고가 나면 대응이 어려울 수 있는 부분이 있어요. 아래에서 '우선 조치'로 표시된 항목부터 확인해 보세요.&quot;;
    } else if (sum >= 3) {

    }

    $(&quot;rtitle&quot;).textContent = title;
    $(&quot;rdesc&quot;).textContent = desc;
    $(&quot;ttitle&quot;).textContent = &quot;내 홈페이지의 관리 구조 · &quot; + TYPES[type].t;
    $(&quot;tdesc&quot;).textContent = TYPES[type].d;

    var ul = $(&quot;items&quot;);
    ul.innerHTML = &quot;&quot;;
    var labels = [&quot;잘하고 있어요&quot;, &quot;확인이 필요해요&quot;, &quot;우선 조치&quot;];
    keys.forEach(function (k) {
      var p = answers[k] ? answers[k].pts : 0;
      var li = document.createElement(&quot;li&quot;);
      li.className = &quot;item&quot;;
      var head = document.createElement(&quot;div&quot;);
      head.className = &quot;item-head&quot;;
      var chip = document.createElement(&quot;span&quot;);
      chip.className = &quot;chip s&quot; + p;
      chip.textContent = labels[p];
      var name = document.createElement(&quot;span&quot;);
      name.className = &quot;item-name&quot;;
      name.textContent = CHECKS[k].name;
      head.appendChild(chip);
      head.appendChild(name);
      li.appendChild(head);
      if (p > 0) {
        var tip = document.createElement(&quot;p&quot;);
        tip.className = &quot;item-tip&quot;;
        tip.textContent = (k === &quot;c1&quot;) ? tipC1(type, p) : TIPS[k];
        li.appendChild(tip);
      }
      ul.appendChild(li);
    });
    show(&quot;result&quot;);
  }

  $(&quot;restart&quot;).addEventListener(&quot;click&quot;, function () { answers = {}; idx = 0; type = &quot;unsure&quot;; show(&quot;intro&quot;); });
})();
