<html lang=&quot;ko&quot;>
<head>

<title>홈페이지 제작 견적 계산기</title>

<style>
:root{
  --accent:#171616;      /* 포인트 컬러 */
  --ink:#16181d;
  --muted:#6b7280;
  --line:#e5e7eb;
  --soft:#f6f7f9;
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,-apple-system,&quot;Apple SD Gothic Neo&quot;,&quot;Noto Sans KR&quot;,sans-serif;color:var(--ink);background:transparent;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
h1{font-size:clamp(22px,3.4vw,30px);margin:0 0 6px;letter-spacing:-.02em;line-height:1.3}
.sub{color:var(--muted);margin:0 0 28px;font-size:15px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr;gap:24px}
@media(min-width:820px){
  .grid{grid-template-columns:1.25fr 1fr;align-items:start}
  .summary{position:sticky;top:16px}
}
.step{margin-bottom:28px}
.step h2{font-size:15px;margin:0 0 12px;display:flex;gap:8px;align-items:center;font-weight:700}
.num{background:var(--ink);color:#fff;width:22px;height:22px;border-radius:50%;font-size:12px;display:grid;place-items:center;flex:none}
.opt{display:block;position:relative;border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;background:#fff;transition:border-color .15s,box-shadow .15s}
.opt:hover{border-color:#c5c9d1}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,79,255,.13)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.opt b{font-weight:600;font-size:15px}
.opt small{display:block;color:var(--muted);margin-top:4px;font-size:13px;line-height:1.45}
.price{color:var(--muted);font-size:13px;white-space:nowrap}

/* 기본 제공 */
.incl{background:var(--soft);border:1.5px dashed #cfd3da;border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
.incl h3{margin:0 0 10px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.incl h3 span{font-size:12px;font-weight:500;color:var(--muted)}
.incl ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px}
.incl li{font-size:14px;display:flex;gap:6px;align-items:baseline}
.incl li::before{content:&quot;✓&quot;;color:var(--accent);font-weight:800}
.sublabel{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 10px}

.stepper{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 16px;background:#fff;gap:12px}
.stepper .lbl b{font-size:15px;font-weight:600;display:block}
.stepper .lbl small{color:var(--muted);font-size:13px}
.ctrl{display:flex;align-items:center;gap:14px}
.ctrl button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:18px;line-height:1;cursor:pointer;color:var(--ink)}
.ctrl button:hover{border-color:var(--ink)}
.ctrl button:disabled{opacity:.35;cursor:not-allowed}
.ctrl span{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.summary-card{background:#fff;border:1.5px solid var(--ink);border-radius:18px;padding:22px}
.summary-card h3{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.total{font-size:clamp(26px,4.2vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.2;margin:0 0 4px;font-variant-numeric:tabular-nums}
.total small{display:block;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0;margin-top:6px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.lines{list-style:none;margin:0;padding:0;font-size:14px}
.lines li{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.lines li span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.inc-note{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.pay{font-size:13px}
.pay h4{margin:0 0 8px;font-size:13px;font-weight:700}
.pay div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;color:var(--muted)}
.pay div b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.btns{display:grid;gap:8px;margin-top:18px}
.btns:empty{display:none}
.btn{display:block;text-align:center;text-decoration:none;border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:13px 16px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{filter:brightness(.95)}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin:14px 0 0}
</style>

  addons: [
    { id: &quot;copy&quot;,   label: &quot;카피라이팅&quot;,        desc: &quot;문구 작성 및 구성안 제안&quot;,             price: 40 },
    { id: &quot;cms&quot;,    label: &quot;CMS·블로그 세팅&quot;,    desc: &quot;직접 글을 올릴 수 있는 관리 환경&quot;,       price: 30 },
    { id: &quot;seo&quot;,    label: &quot;SEO·GEO 최적화&quot;,    desc: &quot;AI 검색 노출을 위한 고급 세팅&quot;,         price: 40 },
    { id: &quot;image&quot;,  label: &quot;이미지 제안&quot;,        desc: &quot;메인 비주얼에 들어갈 이미지 제안&quot;,       price: 15 },
    { id: &quot;form&quot;,   label: &quot;문의·예약 폼 연동&quot;,   desc: &quot;문의 접수 알림 및 폼 연동&quot;,            price: 10 },
    { id: &quot;motion&quot;, label: &quot;고급 인터랙션&quot;,      desc: &quot;스크롤 애니메이션 등 연출&quot;,             price: 50 }
  ],

  // 추가 페이지 (1페이지당)
  extraPage: { label: &quot;추가 페이지&quot;, desc: &quot;선택한 유형 기본 구성 외 추가 제작&quot;, price: 20, max: 10 },

  // 납기 단축 (총액에 가산)
  rush: { label: &quot;납기 단축&quot;, desc: &quot;일정을 앞당겨 우선 진행&quot;, rate: 0.2 },

  // 결제 구조
  payment: { deposit: 50, middleRatio: 0.6 },   // 착수금 50만원 정액, 나머지는 중도금 60% / 잔금 40%

  disclaimer: &quot;본 금액은 선택하신 조건 기준의 예상 견적이며, 정확한 금액과 일정은 상담 후 확정됩니다. 부가세 및 별도 비용(도메인·유료 플러그인 등)은 상담 시 안내드립니다.&quot;
};
/* ===================================================== */

const fmt = n => n.toLocaleString(&quot;ko-KR&quot;) + &quot;만원&quot;;
const r5  = n => Math.round(n / 5) * 5;
const state = { type: CONFIG.defaultType, addons: new Set(), extra: 0, rush: false };

document.getElementById(&quot;title&quot;).textContent = CONFIG.title;
document.getElementById(&quot;subtitle&quot;).textContent = CONFIG.subtitle;

/* ---------- 폼 렌더 ---------- */
const typesHTML = CONFIG.types.map(t => `
  <label class=&quot;opt&quot; data-kind=&quot;type&quot; data-id=&quot;${t.id}&quot;>
    <input type=&quot;radio&quot; name=&quot;type&quot; value=&quot;${t.id}&quot;>
    <div class=&quot;row&quot;><b>${t.label}</b><span class=&quot;price&quot;>${t.min.toLocaleString()}~${t.max.toLocaleString()}만원</span></div>
    <small>${t.desc}</small>
  </label>`).join(&quot;&quot;);

const includedHTML = `
  <div class=&quot;incl&quot;>
    <h3>${CONFIG.included.label}<span>${CONFIG.included.note}</span></h3>
    <ul>${CONFIG.included.items.map(i => `<li>${i}</li>`).join(&quot;&quot;)}</ul>
  </div>`;

const addonsHTML = CONFIG.addons.map(a => `
  <label class=&quot;opt&quot; data-kind=&quot;addon&quot; data-id=&quot;${a.id}&quot;>
    <input type=&quot;checkbox&quot; value=&quot;${a.id}&quot;>
    <div class=&quot;row&quot;><b>${a.label}</b><span class=&quot;price&quot;>+${a.price}만원</span></div>
    <small>${a.desc}</small>
  </label>`).join(&quot;&quot;);

document.getElementById(&quot;form&quot;).innerHTML = `
  <div class=&quot;step&quot;><h2><span class=&quot;num&quot;>1</span>사이트 유형을 선택하세요</h2>${typesHTML}</div>
  <div class=&quot;step&quot;><h2><span class=&quot;num&quot;>2</span>필요한 옵션을 선택하세요</h2>
    ${includedHTML}
    <p class=&quot;sublabel&quot;>추가 옵션</p>
    ${addonsHTML}
    <div class=&quot;stepper&quot;>
      <div class=&quot;lbl&quot;><b>${CONFIG.extraPage.label}</b><small>${CONFIG.extraPage.desc} · 페이지당 +${CONFIG.extraPage.price}만원</small></div>
      <div class=&quot;ctrl&quot;>
        <button type=&quot;button&quot; id=&quot;minus&quot; aria-label=&quot;페이지 줄이기&quot;>−</button>
        <span id=&quot;extraCount&quot;>0</span>
        <button type=&quot;button&quot; id=&quot;plus&quot; aria-label=&quot;페이지 늘리기&quot;>+</button>
      </div>
    </div>
  </div>
  <div class=&quot;step&quot;><h2><span class=&quot;num&quot;>3</span>일정이 급하신가요?</h2>
    <label class=&quot;opt&quot; data-kind=&quot;rush&quot;>
      <input type=&quot;checkbox&quot; id=&quot;rush&quot;>
      <div class=&quot;row&quot;><b>${CONFIG.rush.label}</b><span class=&quot;price&quot;>총액 +${Math.round(CONFIG.rush.rate * 100)}%</span></div>
      <small>${CONFIG.rush.desc}</small>
    </label>
  </div>`;

/* ---------- 계산 ---------- */
function calculate() {
  const t = CONFIG.types.find(x => x.id === state.type);
  const lines = [];
  let min = t.min, max = t.max;
  lines.push([t.label + &quot; (기본)&quot;, `${t.min.toLocaleString()}~${t.max.toLocaleString()}만원`]);

  CONFIG.addons.forEach(a => {
    if (state.addons.has(a.id)) { min += a.price; max += a.price; lines.push([a.label, &quot;+&quot; + a.price + &quot;만원&quot;]); }
  });
  if (state.extra > 0) {
    const p = state.extra * CONFIG.extraPage.price;
    min += p; max += p;
    lines.push([`추가 페이지 ${state.extra}개`, &quot;+&quot; + p + &quot;만원&quot;]);
  }
  if (state.rush) {
    min *= 1 + CONFIG.rush.rate; max *= 1 + CONFIG.rush.rate;
    lines.push([CONFIG.rush.label, &quot;+&quot; + Math.round(CONFIG.rush.rate * 100) + &quot;%&quot;]);
  }
  min = r5(min); max = r5(max);

  const pay = total => {
    const dep = Math.min(CONFIG.payment.deposit, total);
    const rest = total - dep;
    const mid = r5(rest * CONFIG.payment.middleRatio);
    return { dep, mid, fin: rest - mid };
  };
  return { t, lines, min, max, pMin: pay(min), pMax: pay(max) };
}

/* ---------- 문의 폼으로 넘길 내용 ---------- */
function quoteText(c) {
  const opts = CONFIG.addons.filter(a => state.addons.has(a.id)).map(a => a.label);
  const range = c.min === c.max ? fmt(c.min) : `${fmt(c.min)} ~ ${fmt(c.max)}`;
  return [
    &quot;[홈페이지 제작 견적 문의]&quot;,
    `- 사이트 유형: ${c.t.label}`,
    `- 선택 옵션: ${opts.length ? opts.join(&quot;, &quot;) : &quot;없음&quot;}`,
    `- 추가 페이지: ${state.extra}개`,
    `- 납기 단축: ${state.rush ? &quot;희망&quot; : &quot;해당 없음&quot;}`,
    `- 예상 견적: ${range}`,
    &quot;&quot;,
    &quot;문의 내용:&quot;,
    &quot;&quot;
  ].join(&quot;\n&quot;);
}

function contactHref(c) {
  try {
    const u = new URL(CONFIG.contactUrl);
    u.searchParams.set(&quot;quote&quot;, quoteText(c));
    u.searchParams.set(&quot;src&quot;, &quot;calculator&quot;);
    return u.toString();
  } catch (e) {
    return CONFIG.contactUrl;
  }
}

/* ---------- 렌더 ---------- */
function render() {
  document.querySelectorAll('.opt[data-kind=&quot;type&quot;]').forEach(el => {
    const on = el.dataset.id === state.type;
    el.classList.toggle(&quot;on&quot;, on);
    el.querySelector(&quot;input&quot;).checked = on;
  });
  document.querySelectorAll('.opt[data-kind=&quot;addon&quot;]').forEach(el => {
    const on = state.addons.has(el.dataset.id);
    el.classList.toggle(&quot;on&quot;, on);
    el.querySelector(&quot;input&quot;).checked = on;
  });
  const rushEl = document.querySelector('.opt[data-kind=&quot;rush&quot;]');
  rushEl.classList.toggle(&quot;on&quot;, state.rush);
  document.getElementById(&quot;rush&quot;).checked = state.rush;
  document.getElementById(&quot;extraCount&quot;).textContent = state.extra;
  document.getElementById(&quot;minus&quot;).disabled = state.extra <= 0;
  document.getElementById(&quot;plus&quot;).disabled = state.extra >= CONFIG.extraPage.max;

  const c = calculate();
  const range = (a, b) => a === b ? fmt(a) : `${fmt(a)} ~ ${fmt(b)}`;
  const pr = (a, b) => a === b ? fmt(a) : `${a.toLocaleString()}~${b.toLocaleString()}만원`;

  const contact = CONFIG.contactUrl
    ? `<a class=&quot;btn primary&quot; href=&quot;${contactHref(c).replace(/&amp;/g, &quot;&amp;amp;&quot;)}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>${CONFIG.contactLabel}</a>` : &quot;&quot;;

  document.getElementById(&quot;summary&quot;).innerHTML = `
    <h3>예상 견적</h3>
    <p class=&quot;total&quot;>${range(c.min, c.max)}<small>선택하신 조건 기준</small></p>
    <hr>
    <ul class=&quot;lines&quot;>${c.lines.map(l => `<li><span>${l[0]}</span><span>${l[1]}</span></li>`).join(&quot;&quot;)}</ul>
    <p class=&quot;inc-note&quot;>✓ ${CONFIG.included.label} 항목 포함: ${CONFIG.included.items.join(&quot; · &quot;)}</p>
    <hr>
    <div class=&quot;pay&quot;>
      <h4>결제 일정 예시</h4>
      <div><span>착수금</span><b>${pr(c.pMin.dep, c.pMax.dep)}</b></div>
      <div><span>중도금 (잔액의 ${Math.round(CONFIG.payment.middleRatio * 100)}%)</span><b>${pr(c.pMin.mid, c.pMax.mid)}</b></div>
      <div><span>잔금 (잔액의 ${100 - Math.round(CONFIG.payment.middleRatio * 100)}%)</span><b>${pr(c.pMin.fin, c.pMax.fin)}</b></div>
    </div>
    <div class=&quot;btns&quot;>${contact}</div>
    <p class=&quot;note&quot;>${CONFIG.disclaimer}</p>`;
}

/* ---------- 이벤트 ---------- */
document.getElementById(&quot;form&quot;).addEventListener(&quot;change&quot;, e => {
  const el = e.target;
  if (el.name === &quot;type&quot;) state.type = el.value;
  else if (el.id === &quot;rush&quot;) state.rush = el.checked;
  else if (el.type === &quot;checkbox&quot;) el.checked ? state.addons.add(el.value) : state.addons.delete(el.value);
  render();
});
document.getElementById(&quot;minus&quot;).addEventListener(&quot;click&quot;, () => { state.extra = Math.max(0, state.extra - 1); render(); });
document.getElementById(&quot;plus&quot;).addEventListener(&quot;click&quot;, () => { state.extra = Math.min(CONFIG.extraPage.max, state.extra + 1); render(); });

render();
</script>
</body>
</html>
